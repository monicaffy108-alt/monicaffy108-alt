<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Feiyan Fu — 伏飞燕</title>
  <desc id="d">Embodied AI, dexterous manipulation, robot learning.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66233F"/><stop offset="0.55" stop-color="#7C2C4C"/><stop offset="1" stop-color="#8E3A5D"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.72" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#B25C7C" stop-opacity="0.55"/><stop offset="1" stop-color="#B25C7C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#4E1830" stop-opacity="0.55"/><stop offset="1" stop-color="#4E1830" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.85" fill="#FFFFFF" fill-opacity="0.085"/>
    </pattern>
    <pattern id="mosaic" width="3.2" height="3.2" patternUnits="userSpaceOnUse">`n      <rect x="0.35" y="0.35" width="1.75" height="1.75" fill="#FCEFF4" fill-opacity="0.92"/>
    </pattern>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="frame"><rect width="1200" height="300" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#panel)"/>
    <rect width="1200" height="300" fill="url(#glow1)"/>
    <rect width="1200" height="300" fill="url(#glow2)"/>
    <rect width="1200" height="300" fill="url(#grain)"/>
    <text x="177" y="180" font-family="Georgia, serif" font-weight="700" font-size="172"
          fill="#F7DCE4" opacity="0.45" filter="url(#soft)">Feiyan Fu</text>
    <text x="177" y="180" font-family="Georgia, serif" font-weight="700" font-size="172" fill="url(#mosaic)">Feiyan Fu</text>
    <text x="64" y="250" font-family="Georgia, serif" font-size="19" fill="#FBEFF3" opacity="0.96">Embodied AI · Dexterous Manipulation · Robot Learning</text>
    <text x="64" y="276" font-family="Georgia, serif" font-size="15" fill="#F7E4EA" opacity="0.72">〔Undergraduate〕 · 〔University〕</text>
  </g>
</svg>
